---
name: on pull_request (renovate AI review)

"on":
  pull_request:
    # openedは含めない: RenovateはPR作成後に別のAPI呼び出しでlabelを付與するため、
    # opened時點ではまだminor/majorラベルが確定してゐない。labelが付與された際は
    # labeledイベントが發火するので、更新種別を確定できるイベントのみを對象にする。
    types: [synchronize, reopened, labeled]

jobs:
  ai-review:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 更新種別に應じたpromptを選ぶ
        id: pr_type
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'minor') }}" == "true" || "${{ contains(github.event.pull_request.labels.*.name, 'major') }}" == "true" ]]; then
            echo "prompt-file=.github/codex/breaking-change-review-prompt.md" >> "$GITHUB_OUTPUT"
          else
            echo "prompt-file=.github/codex/supply-chain-review-prompt.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Codexでreviewする
        id: run_codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          output-file: codex-review.json
          output-schema-file: .github/codex/supply-chain-review-schema.json
          permission-profile: ":read-only"
          prompt-file: ${{ steps.pr_type.outputs.prompt-file }}

      - name: reviewの結果をpull requestにcommentする
        if: always() && steps.run_codex.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          verdict=$(jq -r '.verdict' codex-review.json)
          summary=$(jq -r '.summary' codex-review.json)
          findings=$(jq -r '.findings[] | "- [\(.severity)]" + (if .category then " (\(.category))" else "" end) + " \(.description)"' codex-review.json)
          {
            echo "## Codex review: ${verdict}"
            echo
            echo "${summary}"
            echo
            if [ -n "${findings}" ]; then
              echo "${findings}"
            fi
          } > comment.md
          gh pr comment "${PR_NUMBER}" --body-file comment.md

      - name: 判定する
        run: |
          verdict=$(jq -r '.verdict' codex-review.json)
          if [ "${verdict}" != "approve" ]; then
            echo "Codexが問題を指摘したため、このPRのstatus checkを失敗させます。" >&2
            exit 1
          fi
